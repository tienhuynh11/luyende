# Render Blueprint: một dịch vụ Docker phục vụ cả giao diện lẫn API.
services:
  - type: web
    name: luyende-thcs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TEACHER_INVITE_CODE
        sync: false
